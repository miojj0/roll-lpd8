<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MOJJO FX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0C;--card:#161618;--line:#2A2A2E;--line2:#4A4A50;--ink:#F2F2F0;--mute:#A1A19C;--acc:#FF7A1A;--accInk:#1A0E05;--ok:#4ADE80;--warn:#FF9A4D;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:14px/1.4 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}
.mute{color:var(--mute)}
.small{font-size:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.app{max-width:1200px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;min-height:100vh}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.grow{flex:1}
.btn{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.acc{border-color:var(--acc);color:var(--acc);background:transparent}
.btn.fill{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bpm{display:flex;align-items:center;gap:10px}
.bpm input{width:150px;height:44px;background:transparent;border:1px solid transparent;border-radius:10px;color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:32px;font-weight:700;padding:0 6px}
.bpm input:hover,.bpm input:focus{border-color:var(--line);outline:none}
.chip{display:inline-block;height:22px;line-height:20px;padding:0 8px;border-radius:6px;border:1px solid var(--line);background:transparent;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--ok)}
.chip.lock{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.beats{display:flex;gap:8px}
.beat{width:12px;height:12px;border-radius:50%;background:var(--line)}
.stat{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);display:inline-block}
.dot.on{background:var(--ok)}
.seg{display:flex;gap:4px}
.seg button{flex:1;min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12px;font-weight:700}
.seg button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.music{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.music .seg{min-width:280px}
select{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;max-width:320px}
.main{display:flex;gap:12px;flex-wrap:wrap;flex:1}
.pads{flex:1 1 560px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(130px,1fr));gap:8px;min-height:300px}
.pad{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);touch-action:none;user-select:none;-webkit-user-select:none;text-align:left;transition:background .04s}
.pad .id{font-family:"JetBrains Mono",monospace;font-size:11px}
.pad .nm{font-size:18px;font-weight:700;word-break:break-word}
.pad .st{font-size:12px;color:var(--mute)}
.pad.roll{background:var(--bg);border-color:rgba(255,122,26,.5)}
.pad.roll .nm{font-family:"JetBrains Mono",monospace;font-size:28px;color:var(--acc)}
.pad.on{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.pad.on .nm,.pad.on .st{color:var(--accInk)}
.pad.on .st{font-weight:700}
.pad.flash{border-color:var(--ink)}
.pad.drop{outline:2px dashed var(--acc);outline-offset:2px}
.padw{position:relative;display:flex;min-width:0}
.padw>.pad{flex:1;min-width:0}
.slotbtn{position:absolute;top:6px;right:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:11px;font-weight:700;letter-spacing:.5px}
.pad.target{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.pad.target .st{color:var(--acc);font-weight:700}
.pad.on.target .st{color:var(--accInk)}
.pad.music{background:var(--bg)}
.pad.music .nm{font-size:20px}
.side{flex:0 1 300px;min-width:260px;display:flex;flex-direction:column;gap:8px}
input[type=range]{accent-color:var(--acc);width:100%;height:28px;margin:0}
.knobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 4px;margin:8px 0 6px}
.knob{display:flex;flex-direction:column;align-items:center;gap:1px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;border-radius:10px;padding:4px 0;outline:none;min-width:0}
.knob:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.knob svg{width:52px;height:52px;display:block}
.knob .kk{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--mute)}
.knob .kn{font-size:11.5px;font-weight:700;text-align:center;line-height:1.15;max-width:100%}
.knob .kv{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--mute);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.knob.free{cursor:default}
/* MIDI Learn direto na tela: clica no pad ou knob e mexe no controle */
#mlBtn.on{background:#3B82F6;border-color:#3B82F6;color:#fff}
body.ml .pad,body.ml .knob:not(.free){outline:2px dashed rgba(59,130,246,.75);outline-offset:-2px;cursor:pointer}
body.ml .pad.mapped,body.ml .knob.mapped{outline-style:solid;outline-color:rgba(74,222,128,.8)}
body.ml .mlwait{outline:3px solid #3B82F6!important;animation:mlp .7s ease-in-out infinite alternate}
@keyframes mlp{from{box-shadow:0 0 0 0 rgba(59,130,246,.0)}to{box-shadow:0 0 0 6px rgba(59,130,246,.35)}}
.mltag{position:absolute;font-family:"JetBrains Mono",monospace;font-size:9px;color:#93C5FD;pointer-events:none}
.fbbox{display:flex;flex-direction:column;gap:6px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:10px}
.fbn{width:64px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;padding:0 8px}
.erow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.eseg{display:flex;gap:4px}
.eseg button{height:34px;min-width:64px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--mute);font:inherit;font-size:12px;font-weight:700;letter-spacing:.8px;cursor:pointer}
.eseg button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#eQ.on{background:#DC2626;border-color:#DC2626;color:#fff}
#eM.on{background:#2563EB;border-color:#2563EB;color:#fff}
body.ml #eRow{outline:2px dashed rgba(59,130,246,.75);outline-offset:-2px;cursor:pointer}
body.ml #eRow.mapped{outline-style:solid;outline-color:rgba(74,222,128,.8)}
.emode{margin-top:4px;height:20px;padding:0 10px;border:none;border-radius:10px;color:#fff;font-size:10px;font-weight:700;letter-spacing:.8px;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
.emode:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.knob.free .kn{color:var(--mute);font-weight:500}
.rollbig{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.rollbig .mono{font-size:30px;font-weight:700;color:var(--mute)}
.rollbig .mono.on{color:var(--acc)}
footer{font-size:12px;color:var(--mute);line-height:1.6}
.start{position:fixed;inset:0;background:rgba(11,11,12,.94);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.start .card{max-width:500px;padding:24px;display:flex;flex-direction:column;gap:12px}
.start h1{margin:0;font-size:24px}
dialog{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:16px;width:calc(100% - 32px);max-width:760px}
dialog::backdrop{background:rgba(0,0,0,.7)}
dialog h2{margin:0;font-size:18px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:12px 0}
.slot{min-height:72px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left}
.slot .n{font-family:"JetBrains Mono",monospace;font-size:10px}
.slot b{font-size:13px;word-break:break-word}
.slot.cur{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.slot.empty{border-style:dashed;border-color:var(--line2);color:var(--mute);background:transparent}
.fns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:12px 0}
.fn{min-height:48px;padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left}
.fn b{font-size:13px}
.fn span{font-size:11px;color:var(--mute)}
.fn.none{border-style:dashed;border-color:var(--line2)}
.fn.none span{color:var(--warn)}
.fn.listen{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.fn.listen span{color:var(--accInk);font-weight:700}
.fn.fresh{border-color:var(--ok)}
.spec{position:relative;height:118px;padding:8px 0;overflow:hidden;background:#050506}
.spec canvas{display:block;width:100%;height:100%}
.status{min-height:44px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.status.listen{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--mute)}
.field input[type=number]{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit}
.field select{max-width:none;width:100%}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.show{opacity:1}

/* ---------- console SMC Mixer: 8 canais + coluna BT/SHIFT, transporte embaixo ---------- */
.toprow{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.toprow>.bar{flex:0 0 auto;flex-wrap:nowrap}
.toprow>.spec{flex:1 1 420px;min-width:0;height:96px;padding:0}
.devpanel{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:20px;background:linear-gradient(180deg,#1C1C20 0%,#141417 100%);border:1px solid #303036}
#ctlSel{height:40px;max-width:260px}
.midibar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.midibar .stat{max-width:340px;min-width:0}
.midibar .stat span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rollbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.rollbar .rollbig{margin:0}
.rollbar .qwrap{display:flex;align-items:center;gap:8px}
.rollbar .qwrap .seg{min-width:240px}
.rollbar .erow{margin:0}
.rollbar .help{flex:1 1 260px;min-width:0}
.cwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:20px}
.console{min-width:760px;display:grid;grid-template-columns:repeat(8,minmax(0,1fr)) 62px;gap:6px;padding:14px 12px 12px;border-radius:20px;border:1px solid #303036;background:linear-gradient(180deg,#1C1C20 0%,#141417 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.strip{display:flex;flex-direction:column;gap:6px;min-width:0;padding:6px 4px 8px;border-radius:12px;border:1px solid transparent;transition:background .06s,border-color .06s}
.strip.target{border-color:rgba(255,122,26,.35)}
.strip.active{border-color:var(--acc);background:rgba(255,122,26,.07)}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:4px;padding:0 4px;min-width:0}
.shead .ch{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--mute)}
.shead .tt{font-size:11.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead button.tt{background:none;border:none;padding:0;text-decoration:underline dotted rgba(255,255,255,.3);text-underline-offset:3px}
.enc{display:flex;justify-content:center}
.enc .knob{width:100%}
.led{width:30px;height:4px;border-radius:2px;margin:0 auto;background:#2A2A2E}
.led.on{background:var(--acc);box-shadow:0 0 8px rgba(255,122,26,.7)}
.flab{display:flex;justify-content:space-between;gap:4px;padding:0 4px;font-size:10px;color:var(--mute);min-width:0}
.flab b{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flab .mono{white-space:nowrap}
.sbody{display:flex;justify-content:center;gap:6px}
.fader{position:relative;width:36px;height:190px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;border-radius:8px;outline:none;--v:.5;--g:.5}
.fader:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.fader .fslot{position:absolute;left:50%;top:11px;bottom:11px;width:6px;transform:translateX(-50%);border-radius:3px;background:#050506;box-shadow:inset 0 0 0 1px #000}
.fader .ffill{position:absolute;left:50%;bottom:11px;width:6px;transform:translateX(-50%);border-radius:3px;background:var(--acc);opacity:.55;height:calc(var(--v) * (100% - 22px))}
.fader .fcap{position:absolute;left:2px;width:32px;height:22px;top:calc((1 - var(--v)) * (100% - 22px));border-radius:4px;background:linear-gradient(180deg,#45454B,#26262A);border:1px solid #5A5A61;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.fader .fcap::after{content:"";position:absolute;left:4px;right:4px;top:10px;height:1.5px;background:var(--ink);opacity:.8}
.fader .fghost{position:absolute;left:-2px;right:-2px;height:2px;top:calc((1 - var(--g)) * (100% - 22px) + 10px);background:#3B82F6;border-radius:1px;display:none}
.fader.pickup .fghost{display:block}
.btns{display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.hb{width:46px;height:40px;padding:2px;border-radius:7px;border:1px solid #45454B;background:#2E2E33;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.05;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 2px 0 #0B0B0C}
.hb i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:700}
.hb span{font-size:9.5px;font-weight:600;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.hb:active{transform:translateY(1px);box-shadow:none}
.hb.lit{background:var(--acc);border-color:var(--acc);color:var(--accInk)}
.hb.lit span{color:var(--accInk)}
.hb.lit.go{background:var(--ok);border-color:var(--ok)}
.hb.qm{background:#DC2626;border-color:#DC2626;color:#fff}
.hb.qm span{color:#fff}
.hb.ms{background:#2563EB;border-color:#2563EB;color:#fff}
.hb.ms span{color:#fff}
.hb.free{opacity:.32;cursor:default}
.hb.free:active{transform:none;box-shadow:0 2px 0 #0B0B0C}
/* □ do canal = o pad (P1 a P8) */
.strip .pad{width:46px;height:40px;min-height:0;padding:2px;border-radius:7px;align-items:center;justify-content:center;gap:0;border:1px solid #45454B;background:#2E2E33;box-shadow:0 2px 0 #0B0B0C}
.strip .pad .id,.strip .pad .st{display:none}
.strip .pad .nm,.strip .pad.roll .nm,.strip .pad.music .nm{font-family:"JetBrains Mono",monospace;font-size:10.5px;font-weight:700;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;word-break:normal}
.strip .pad::before{content:"\25A1";font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1;color:var(--mute)}
.strip .pad.target{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc),0 2px 0 #0B0B0C}
.strip .pad.on{background:var(--acc);border-color:var(--acc)}
.strip .pad.on .nm,.strip .pad.on::before{color:var(--accInk)}
.sfoot{display:flex;flex-direction:column;gap:1px;padding:2px 4px 0;min-width:0}
.sfoot b{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sfoot span{font-size:10px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip.active .sfoot span{color:var(--acc)}
.cside{display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:28px}
.bt{display:inline-flex;align-items:center;justify-content:center;width:46px;height:24px;border-radius:12px;border:1px solid #45454B;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;color:var(--mute)}
.bt.on{background:#3B82F6;border-color:#3B82F6;color:#fff;box-shadow:0 0 10px rgba(59,130,246,.6)}
.hb.shift i{font-size:10px;letter-spacing:.5px}
.transport{grid-column:1 / -1;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:6px;padding-top:10px;margin-top:2px;border-top:1px solid #2A2A2E}
.transport .hb{width:100%;height:44px}
.transport .hb svg{width:16px;height:14px;display:block}
body.ml .hb[data-fn],body.ml .fader[data-fn]{outline:2px dashed rgba(59,130,246,.75);outline-offset:-2px;cursor:pointer}
body.ml .hb[data-fn].mapped,body.ml .fader[data-fn].mapped{outline-style:solid;outline-color:rgba(74,222,128,.8)}
.sfoot{font:inherit;color:inherit;text-align:left;background:none;border:none;border-radius:8px}
button.sfoot{cursor:pointer;padding:4px}
button.sfoot:hover b{color:var(--acc)}
.strip.hit{background:rgba(255,122,26,.16)}
.strip.fxs .shead .tt{color:#93C5FD}
.strip.fxs.active{border-color:#3B82F6;background:rgba(59,130,246,.07)}
.strip.fxs.active .sfoot span{color:#93C5FD}
.hb.rl i{font-size:10px}
.hb.pd.empty span{opacity:.5}
.strip.drop{outline:2px dashed var(--acc);outline-offset:-2px;background:rgba(255,122,26,.1)}
.hb.drop{outline:2px dashed var(--acc);outline-offset:2px}
#midiMon{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--mute);max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transport .hb span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb.rl span{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--ink)}
body.ml .knob.mapped{outline-style:solid}
@media (prefers-reduced-motion:reduce){.strip,.hb{transition:none}}
@media (max-width:640px){.slots{grid-template-columns:repeat(2,minmax(0,1fr))}.fns{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.pad.roll .nm{font-size:22px}}

/* ---------- tema neon: roxo bem escuro, magenta nos canais de som (1-4), verde-limão nos efeitos (5-8) ---------- */
:root{--bg:#0D0913;--bg2:#110B19;--card:#160F20;--card2:#1A1226;--panel:var(--panel);--panelB:var(--panelB);--btn:var(--btn);--btnB:var(--btnB);--btnM:var(--btnM);--btnMB:var(--btnMB);--input:var(--input);--shift:var(--shift);--r:16px;--rb:7px;--glow:1;--knob:52px;--font:"Space Grotesk",system-ui,sans-serif;--line:var(--line);--line2:#4A3A62;--ink:#F3EEFA;--mute:#A99CBC;--acc:#C8FF2E;--accInk:#10150A;--mag:#E23BFF;--magInk:#FFFFFF;--ok:#C8FF2E;color-scheme:dark}
html,body{background:radial-gradient(1200px 600px at 85% -10%,rgba(140,60,255,.16),transparent 60%),radial-gradient(900px 500px at -10% 110%,color-mix(in srgb,var(--acc) 6%,transparent),transparent 60%),var(--bg)}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border-color:var(--line);border-radius:16px}
.btn{background:var(--input);border-color:var(--btnB)}
.btn:hover{border-color:color-mix(in srgb,var(--acc) 55%,transparent)}
.btn.fill,#tapBtn.fill{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.bpm input{color:var(--acc);text-shadow:0 0 calc(18px*var(--glow)) color-mix(in srgb,var(--acc) 35%,transparent)}
.chip{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
.chip.lock{background:var(--mag);border-color:var(--mag);color:#fff}
.spec{background:#09060E;border-color:var(--line)}
.dot.on{background:var(--acc);box-shadow:0 0 calc(8px*var(--glow)) var(--acc)}
select{background:var(--input);border-color:var(--btnB)}
.console{background:linear-gradient(180deg,var(--card2) 0%,var(--bg2) 100%);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);box-shadow:0 0 0 calc(1px*var(--glow)) color-mix(in srgb,var(--acc) 8%,transparent),0 0 calc(40px*var(--glow)) color-mix(in srgb,var(--acc) 7%,transparent),inset 0 1px 0 rgba(255,255,255,.03)}
.strip{background:var(--panel);border:1px solid var(--panelB)}
.strip .shead .tt{color:var(--ink);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
#strip-1 .tt,#strip-2 .tt,#strip-3 .tt,#strip-4 .tt{text-decoration-color:var(--mag)}
#strip-5 .tt,#strip-6 .tt,#strip-7 .tt,#strip-8 .tt,.strip.fxs .shead .tt{color:var(--ink);text-decoration-color:var(--acc)}
.strip.active{border-color:var(--mag);background:color-mix(in srgb,var(--mag) 7%,transparent);box-shadow:0 0 calc(22px*var(--glow)) color-mix(in srgb,var(--mag) 12%,transparent)}
.strip.fxs.active{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 5%,transparent);box-shadow:0 0 calc(22px*var(--glow)) color-mix(in srgb,var(--acc) 10%,transparent)}
.strip.active .sfoot span{color:#F08CFF}
.strip.fxs.active .sfoot span{color:var(--acc)}
.hb{background:var(--btn);border-color:var(--btnB);box-shadow:0 2px 0 #0B0710}
.hb span{color:#BFB2D2}
#strip-1 .hb,#strip-2 .hb,#strip-3 .hb,#strip-4 .hb{background:var(--btnM);border-color:var(--btnMB)}
.hb.lit{background:var(--acc);border-color:var(--acc);color:var(--accInk);box-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--acc) 45%,transparent)}
.hb.lit span{color:var(--accInk)}
#strip-1 .hb.lit,#strip-2 .hb.lit,#strip-3 .hb.lit,#strip-4 .hb.lit,.hb.rl.lit{background:var(--mag);border-color:var(--mag);color:#fff;box-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--mag) 55%,transparent)}
#strip-1 .hb.lit span,#strip-2 .hb.lit span,#strip-3 .hb.lit span,#strip-4 .hb.lit span,.hb.rl.lit span{color:#fff}
.hb.qm{background:var(--acc);border-color:var(--acc);color:var(--accInk);box-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--acc) 45%,transparent)}
.hb.qm span{color:var(--accInk)}
.hb.ms{background:#3CC8FF;border-color:#3CC8FF;color:#06131A}
.hb.ms span{color:#06131A}
.hb.shift.lit{background:var(--shift);border-color:var(--shift);color:#1A0C02;box-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--shift) 50%,transparent)}
.hb.shift.lit span{color:#1A0C02}
.hb.lit.go{background:var(--acc)}
.bt.on{background:#2F7BFF;border-color:#2F7BFF;box-shadow:0 0 12px rgba(47,123,255,.6)}
.fader .fslot{background:#07050B}
.fader .ffill{width:8px;opacity:1;background:linear-gradient(0deg,#7A2CFF,var(--acc));box-shadow:0 0 calc(12px*var(--glow)) color-mix(in srgb,var(--acc) 55%,transparent)}
#strip-1 .ffill,#strip-2 .ffill,#strip-3 .ffill,#strip-4 .ffill{background:linear-gradient(0deg,#7A2CFF,var(--mag));box-shadow:0 0 calc(12px*var(--glow)) color-mix(in srgb,var(--mag) 60%,transparent)}
.fader .fcap{background:linear-gradient(180deg,#56486B,#2C223C);border-color:#6A5A82}
.led.on{background:var(--acc);box-shadow:0 0 calc(10px*var(--glow)) var(--acc)}
#led-1.on,#led-2.on,#led-3.on,#led-4.on{background:var(--mag);box-shadow:0 0 calc(10px*var(--glow)) var(--mag)}
.transport{border-top-color:var(--line)}
.hb.pd{background:var(--input)}
.hb.pd.lit{background:var(--acc)}
.devpanel{background:linear-gradient(180deg,var(--card2) 0%,var(--bg2) 100%);border:1px solid color-mix(in srgb,var(--acc) 35%,transparent)}
.knob .kk{color:#8E80A6}
.brand{display:flex;align-items:center;gap:10px;margin-right:6px}
.brand b{display:block;font-size:22px;line-height:1;letter-spacing:2px;font-weight:800;color:var(--acc);text-shadow:0 0 calc(16px*var(--glow)) color-mix(in srgb,var(--acc) 35%,transparent)}
@media (max-width:640px){.toprow>.bar{flex-wrap:wrap;flex:1 1 100%}.bpm input{width:130px;font-size:28px}}

body,button,select,input{font-family:var(--font)}
.card{border-radius:var(--r)}
.console,.devpanel{border-radius:calc(var(--r) + 4px)}
.strip{border-radius:calc(var(--r) * .75)}
.hb{border-radius:var(--rb)}
.btn,select{border-radius:calc(var(--rb) + 3px)}
.knob svg{width:var(--knob,52px);height:var(--knob,52px)}
.ffill{opacity:1}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 120px 64px;align-items:center;gap:10px;font-size:13px}
.trow input[type=range]{width:120px;accent-color:var(--acc)}
.trow select{height:34px;width:120px;max-width:none}
.trow b{font-size:11px;color:var(--mute);text-align:right}
.inrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.inrow select{min-width:260px;max-width:100%}

/* ---------- placas das controladoras ---------- */
.devpanel{padding:14px;overflow-x:auto}
.devnote{margin:12px 2px 0;max-width:900px}
.face{position:relative;display:grid;gap:16px 22px;align-items:start;padding:30px 24px 26px;border-radius:20px;background:linear-gradient(180deg,#2B2B30 0%,#18181B 100%);border:1px solid #3C3C42;box-shadow:inset 0 1px 0 rgba(255,255,255,.09),0 16px 50px rgba(0,0,0,.5)}
.brandmark{position:absolute;left:22px;top:10px;font:700 10px/1 var(--font);letter-spacing:.22em;color:#C9C9CF;opacity:.85;white-space:nowrap}
.wordmark{grid-column:1/-1;justify-self:end;font:300 26px/1 var(--font);letter-spacing:.14em;color:#8E8E96}
.dbtn,.face .hb.sq{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:46px;padding:2px 3px;border-radius:8px;border:2px solid #4B4B53;background:#202024;color:#D6D6DC;font:700 9.5px/1.1 var(--font);letter-spacing:.04em;text-transform:uppercase;text-align:center;box-shadow:0 2px 0 #0B0B0C;gap:1px}
.dbtn{opacity:.75;cursor:default}
.dbtn.red{border-color:#FF3B30}.dbtn.green{border-color:#3CDC6A}
.dbtn.small,.face .hb.sq.small{height:38px;font-size:9px}
.face .hb.sq i{font-style:normal;font-size:9.5px;color:#D6D6DC}
.face .hb.sq span{font-size:9px;color:#9A9AA4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-transform:none}
.face .hb.sq.lit{background:var(--acc);border-color:var(--acc)}
.face .hb.sq.lit i,.face .hb.sq.lit span{color:var(--accInk)}
.dside{display:grid;gap:8px;align-content:start}
.dside2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dside2.three{grid-template-columns:repeat(3,1fr);gap:6px}
.dside2.four{grid-template-columns:repeat(4,1fr);gap:6px}
.dknobs{display:grid;gap:12px 6px;min-width:0}
.dknobs .knob{width:100%}
.dpads{display:grid;gap:12px;min-width:0}
.dpads .hb{width:100%;height:auto;aspect-ratio:1;min-height:70px;border-radius:10px;background:#0B0B0D;border:3px solid var(--rim,#FF3B30);box-shadow:0 0 14px color-mix(in srgb,var(--rim,#FF3B30) 45%,transparent),inset 0 0 18px rgba(0,0,0,.85);gap:4px;color:var(--ink)}
.dpads .hb i{font-style:normal;font-size:10px;color:#9A9AA2;letter-spacing:.06em}
.dpads .hb span{font-size:11.5px;color:var(--ink);white-space:normal;text-align:center;line-height:1.1}
.dpads .hb.lit{background:color-mix(in srgb,var(--rim,#FF3B30) 62%,#000)}
.dpads .hb.lit i,.dpads .hb.lit span{color:#fff}
.dpads .hb.drop{outline:2px dashed var(--acc)}
.rim-red{--rim:#FF3B30}
/* LPD8 */
.face-lpd8{grid-template-columns:150px minmax(280px,1fr) minmax(300px,1fr);min-width:820px}
/* MPK mini */
.face-mpkmini{grid-template-columns:170px minmax(260px,1fr) minmax(300px,1.1fr);min-width:900px}
.mpkside{display:flex;flex-direction:column;gap:14px}
.joy{width:96px;height:96px;margin:2px auto 4px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#55555C,#1A1A1D 70%);border:2px solid #0C0C0E;box-shadow:inset 0 0 0 6px #232327,0 3px 10px rgba(0,0,0,.6)}
.mpkright{display:flex;flex-direction:column;gap:14px;min-width:0}
.mpktop{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,1.3fr);gap:10px;align-items:center}
.dscreen{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:58px;padding:8px 10px;border-radius:6px;background:#050507;border:2px solid #34343A;font-family:"JetBrains Mono",monospace;color:#E8E8EC;min-width:0}
.dscreen b{font-size:12px;letter-spacing:.06em}
.dscreen span{font-size:9.5px;color:#9A9AA4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* SMK37 */
.face-smk37{grid-template-columns:104px minmax(520px,1fr) 360px;min-width:1100px}
.dwheels{display:flex;gap:10px;justify-content:center}
.dwheels .knob.wheel{width:46px;padding:10px 0;border-radius:23px;background:linear-gradient(90deg,#0E0E10,#303036 50%,#0E0E10);border:1px solid #4B4B53}
.smkmid{display:flex;flex-direction:column;gap:14px;min-width:0}
.smktop{display:grid;grid-template-columns:170px minmax(0,1fr);gap:14px;align-items:start}
.smkleft{display:flex;flex-direction:column;gap:8px}
.smkpads{grid-template-columns:repeat(8,minmax(0,1fr))}
.smkpads .hb{aspect-ratio:auto;height:64px;min-height:0}
.smkpads .hb.row1{--rim:#5EE8E0}
.smkpads .hb.row2{--rim:#C79BFF}
.smkright{display:flex;flex-direction:column;gap:14px;min-width:0}
.dfaders{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dfader{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.dfader .fader{height:150px}
.dft{font:700 10px var(--font);color:#9A9AA4;letter-spacing:.08em}
.dfv{font-size:10px;color:var(--mute)}
.dfl{font-size:10px;font-weight:700;color:#C9C9CF;text-align:center;line-height:1.15}
.dbtns{display:grid;gap:6px}
/* nanoKONTROL2 */
.face-nano2{grid-template-columns:200px minmax(0,1fr);min-width:960px}
.nanoside{display:flex;flex-direction:column;gap:12px;align-content:start}
.ngroup{display:flex;flex-direction:column;gap:5px}
.nlab{font:700 9px var(--font);letter-spacing:.14em;color:#B9B9C1;text-transform:uppercase}
.nrow{display:flex;gap:8px}.nrow>*{flex:1}
.nrow.wrap{flex-wrap:wrap}.nrow.wrap>*{flex:0 0 calc(33.33% - 6px)}
.nstrips{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.nstrip{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 4px 10px;border-radius:12px;background:rgba(0,0,0,.28);min-width:0}
.nbody{display:flex;gap:8px;align-items:stretch;width:100%;justify-content:center}
.nbtns{display:flex;flex-direction:column;gap:8px;width:46px}
.nfad{width:36px}
.nfad .fader{height:170px}
.nname{font-size:11px;color:#C9C9CF;letter-spacing:.04em}
/* Launch Control */
.face-lcxl{grid-template-columns:190px minmax(0,1fr);min-width:960px;padding-top:34px}
.brandmark.lc{letter-spacing:.3em;font-size:11px}
.lcleft{display:flex;flex-direction:column;gap:12px}
.lcgrp{display:flex;flex-direction:column;gap:4px}
.lcpair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lcknobs{display:flex;flex-direction:column;gap:14px;min-width:0}
.lcrow{grid-template-columns:repeat(8,minmax(0,1fr))}
.lck .kk{display:none}
.lck .kn{font-size:10px}
.lck::after{content:"";display:block;width:24px;height:5px;margin-top:4px;border-radius:3px;background:var(--led);box-shadow:0 0 8px var(--led)}
.lc0{--led:#39A9FF}.lc1{--led:#D84BFF}
.lcbar{grid-column:1/-1;display:grid;grid-template-columns:190px minmax(0,1fr);gap:22px;align-items:center;padding:10px 0 0;border-top:1px solid #2F2F35;border-radius:0}
.lcfn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lcbtns{display:grid;gap:10px}
.face .hb.lcb{height:50px;position:relative;border-radius:6px;background:#141417;border-color:#2F2F35}
.face .hb.lcb::after{content:"";position:absolute;left:18%;right:18%;top:7px;height:4px;border-radius:2px;background:var(--led);box-shadow:0 0 8px var(--led)}
.lcbtns .hb:nth-child(1){--led:#E04BFF}.lcbtns .hb:nth-child(2){--led:#A66BFF}.lcbtns .hb:nth-child(3){--led:#5C7CFF}.lcbtns .hb:nth-child(4){--led:#3FB4FF}
.lcbtns .hb:nth-child(5){--led:#45E0E0}.lcbtns .hb:nth-child(6){--led:#3CE8A8}.lcbtns .hb:nth-child(7){--led:#4FEA7E}.lcbtns .hb:nth-child(8){--led:#7BEF5A}
.face .hb.lcb i{margin-top:8px}
</style>

<div class="app">
  <section class="card music">
    <div class="brand"><b>MOJJO FX</b></div>
    <div class="inrow">
      <select id="inSel" aria-label="Entrada de áudio"><option value="">Entrada de áudio</option></select>
      <span class="small mute" id="liveTxt">escolha de onde o áudio entra</span>
    </div>
    <div class="grow"></div>
    <div class="midibar">
      <select id="ctlSel" aria-label="Controladora"></select>
      <span class="stat"><i class="dot" id="midiDot"></i><span id="midiTxt">MIDI desligado</span></span>
      <button class="btn" id="mlBtn" aria-pressed="false">MIDI Learn</button>
      <button class="btn" id="learnBtn">Mapear (lista)</button>
      <button class="btn" id="audioBtn">Áudio</button>
      <span id="midiMon">mexa na SMC para ver o MIDI que chega</span>
    </div>
  </section>

  <div class="toprow">
  <header class="bar">
    <div class="bpm">
      <input id="bpmIn" type="number" step="0.01" min="60" max="200" value="124.00" aria-label="BPM">
      <div style="display:flex;flex-direction:column;gap:4px">
        <span class="small mute" style="letter-spacing:1px">BPM</span>
        <button type="button" class="chip" id="bpmSrc" aria-label="Alternar BPM automático ou travado">AUTO</button>
      </div>
    </div>
    <button class="btn" id="tapBtn">TAP</button>
    <div style="display:flex;gap:4px" role="group" aria-label="Ajuste fino do grid">
      <button class="btn" id="nudgeL" aria-label="Adiantar o grid 10 ms">Grid −</button>
      <button class="btn" id="nudgeR" aria-label="Atrasar o grid 10 ms">Grid +</button>
    </div>
  </header>

  <section class="card spec" aria-label="Forma de onda da música">
    <canvas id="specCv" role="img" aria-label="Forma de onda colorida: vermelho é grave, verde é médio, azul é agudo"></canvas>
  </section>
  </div>

  <section class="card devpanel" id="devPanel" aria-label="Controladora" hidden></section>
  <div class="cwrap">
    <section class="console" id="console" aria-label="SMC Mixer">
      <div class="cside" id="cside">
        <span class="bt" id="btPill" title="Controlador MIDI conectado">BT</span>
        <button type="button" class="hb shift" data-fn="shift" id="shiftBtn" aria-pressed="false"><i>SHIFT</i><span>AUTO</span></button>
      </div>
      <div class="transport" id="transport"></div>
    </section>
  </div>

</div>

<dialog id="slotDlg" aria-labelledby="slotTitle">
  <div class="row">
    <h2 id="slotTitle">Escolha o sample</h2>
    <span class="small mute" id="slotCount"></span>
  </div>
  <div class="slots" id="slots"></div>
  <div class="bar">
    <button class="btn acc" id="slotReplace">Trocar o slot atual</button>
    <button class="btn" id="slotClear">Esvaziar o slot atual</button>
    <div class="grow"></div>
    <button class="btn" id="slotClose">Fechar</button>
  </div>
  <input type="file" id="slotFile" accept="audio/*" hidden>
</dialog>

<dialog id="learnDlg" aria-labelledby="learnTitle">
  <div class="row"><h2 id="learnTitle">Mapear controles</h2><span class="small mute mono" id="lastMidi">nenhum MIDI recebido</span></div>
  <div class="bar" style="margin-top:12px">
    <select id="ctlProf" aria-label="Controlador"><option value="smccc">SMC Mixer · CC</option><option value="smk37cc">SMK37 Pro · CC</option></select>
    <select id="encMode" aria-label="Tipo dos encoders"><option value="mcu">Encoders: Mackie (relativo)</option><option value="twos">Encoders: relativo (complemento de 2)</option><option value="abs">Encoders: absoluto (0 a 127)</option></select>
    <select id="gridLed" aria-label="Luz do grid nos knobs"></select>
    <button class="btn" id="gridTest">Testar luz do grid</button>
    <select id="midiOutSel" aria-label="Saída MIDI das luzes"></select>
    <button class="btn" id="btnTest">Testar luzes dos botões</button>
    <button class="btn" id="ledSweep">Varrer notas 0-127</button>
    <button class="btn fill" id="learnSeq">Mapear tudo em sequência</button>
    <button class="btn" id="learnSkip" hidden>Pular</button>
  </div>
  <div class="status" id="learnStatus" style="margin-top:12px" aria-live="polite">Toque numa função e depois mexa no controle da SMC.</div>
  <div class="fns" id="fns"></div>
  <div class="bar">
    <button class="btn" id="learnReset">Restaurar padrão</button>
    <div class="grow"></div>
    <button class="btn fill" id="learnClose">Concluir</button>
  </div>
</dialog>

<dialog id="audioDlg" aria-labelledby="audioTitle">
  <h2 id="audioTitle">Áudio</h2>
  <div class="grid2">
    <div class="field">
      <label for="outSel">Saída (interface ou USB do mixer)</label>
      <select id="outSel"><option value="">Saída padrão do sistema</option></select>
      <span class="small mute" id="outNote"></span>
    </div>
    <div class="field">
      <label>Latência estimada</label>
      <span class="mono" id="latTxt" style="height:44px;display:flex;align-items:center">-</span>
    </div>
    <div class="field">
      <label for="bpmMin">Auto BPM: mínimo</label>
      <input id="bpmMin" type="number" min="60" max="200" value="115">
    </div>
    <div class="field">
      <label for="bpmMax">Auto BPM: máximo</label>
      <input id="bpmMax" type="number" min="60" max="200" value="135">
    </div>
    <div class="field" style="grid-column:1 / -1">
      <label>Quantize dos toques únicos (SHIFT + roll, pads de baixo, Z X C)</label>
      <div class="seg" id="quant" role="group" aria-label="Quantize dos toques únicos">
        <button type="button" data-q="0">Off</button>
        <button type="button" data-q="1" class="on">1/16</button>
        <button type="button" data-q="2">1/8</button>
        <button type="button" data-q="3">1/4</button>
      </div>
    </div>
  </div>
  <div class="bar">
    <button class="btn" id="testSnd">Testar som</button>
    <div class="grow"></div>
    <button class="btn fill" id="audioClose">Fechar</button>
  </div>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';

/* ---------- canais da SMC Mixer ----------
   CH1-3 Kick, Snare, Clap · CH4 Music · CH5 Reverb · CH6 Echo · CH7 Combo FX · CH8 FX bus (filtro, master e o que vai pro FX) */

const top = (a) => (a.length ? a[a.length - 1] : null);
const beatLen = () => 60 / st.bpm;
const divLen = (d) => beatLen() * DIV_BEATS[d];
function anchorEff() { return st.anchor + st.gridOff; }
function gridNext(t, L) { const a = anchorEff(); return a + Math.ceil((t - a) / L - 1e-6) * L; }
// quantize dos pads (como no X-PAD do RMX): o toque cai na próxima divisão do grid.
// Se o dedo chegou até 30 ms depois da divisão, toca na hora (atraso imperceptível).
const QUANTS = [['Off', 0], ['1/16', 0.25], ['1/8', 0.5], ['1/4', 1]];
function quantTime(t) {
  const q = QUANTS[st.quant][1];
  if (!q) return t;
  const L = beatLen() * q, a = anchorEff();
  const prev = a + Math.floor((t - a) / L) * L;
  return t - prev < 0.03 ? t : prev + L;
}
const slotOf = (p) => pads[p].slots[pads[p].cur];

/* ---------- samples provisórios (gerados aqui mesmo) ---------- */
function noise(oc, len) {
  const b = oc.createBuffer(1, Math.ceil(oc.sampleRate * len), oc.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = oc.createBufferSource(); s.buffer = b; return s;
}
async function render(len, build) {
  const oc = new OfflineAudioContext(2, Math.ceil(44100 * len), 44100);
  build(oc);
  return oc.startRendering();
}
function kick(f0, f1, dec) {
  return render(dec + 0.05, (oc) => {
    const o = oc.createOscillator(), g = oc.createGain();
    o.frequency.setValueAtTime(f0, 0); o.frequency.exponentialRampToValueAtTime(f1, 0.12);
    g.gain.setValueAtTime(1, 0); g.gain.exponentialRampToValueAtTime(0.001, dec);
    o.connect(g).connect(oc.destination); o.start(0); o.stop(dec);
    const c = noise(oc, 0.01), cg = oc.createGain(); cg.gain.value = 0.25;
    c.connect(cg).connect(oc.destination); c.start(0);
  });
}
function clap(tail) {
  return render(tail + 0.1, (oc) => {
    const bp = oc.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1150; bp.Q.value = 1.1;
    bp.connect(oc.destination);
    [0, 0.011, 0.022, 0.034].forEach((t, i, arr) => {
      const n = noise(oc, tail + 0.05), g = oc.createGain();
      const last = i === arr.length - 1;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + 0.002);
      g.gain.exponentialRampToValueAtTime(0.01, t + (last ? tail : 0.01));
      n.connect(g).connect(bp); n.start(t); n.stop(t + (last ? tail + 0.02 : 0.02));
    });
  });
}
function snare(dec) {
  return render(dec + 0.05, (oc) => {
    const n = noise(oc, dec + 0.02), hp = oc.createBiquadFilter(), g = oc.createGain();
    hp.type = 'highpass'; hp.frequency.value = 1500;
    g.gain.setValueAtTime(0.9, 0); g.gain.exponentialRampToValueAtTime(0.001, dec);
    n.connect(hp).connect(g).connect(oc.destination); n.start(0);
    const o = oc.createOscillator(), og = oc.createGain();
    o.type = 'triangle'; o.frequency.setValueAtTime(190, 0); o.frequency.exponentialRampToValueAtTime(150, 0.08);
    og.gain.setValueAtTime(0.7, 0); og.gain.exponentialRampToValueAtTime(0.001, 0.11);
    o.connect(og).connect(oc.destination); o.start(0); o.stop(0.12);
  });
}
function hat(dec) {
  return render(dec + 0.05, (oc) => {
    const n = noise(oc, dec + 0.02), hp = oc.createBiquadFilter(), g = oc.createGain();
    hp.type = 'highpass'; hp.frequency.value = 7000;
    g.gain.setValueAtTime(0.6, 0); g.gain.exponentialRampToValueAtTime(0.001, dec);
    n.connect(hp).connect(g).connect(oc.destination); n.start(0);
  });
}

/* ---------- pitch da música (CH4): deslocador de pitch com duas linhas de atraso ----------
   Cada linha lê a música com um atraso que muda em rampa (rampa para cima = som mais grave, para baixo = mais agudo).
   As duas se revezam com um crossfade de potência igual, então o pitch muda sem mudar o andamento. */
function makeShifter() {
  const T = 0.1, F = 0.05, sr = ctx.sampleRate;
  const n1 = Math.round(T * sr), n2 = Math.round((T - 2 * F) * sr), fadeN = Math.round(F * sr);
  const mkBuf = (fn) => { const b = ctx.createBuffer(1, n1 + n2, sr), d = b.getChannelData(0); for (let i = 0; i < n1; i++) d[i] = fn(i, n1); return b; };
  const fadeBuf = mkBuf((i, n) => (i < fadeN ? Math.sqrt(i / fadeN) : i >= n - fadeN ? Math.sqrt(Math.max(0, 1 - (i - (n - fadeN)) / fadeN)) : 1));
  const upBuf = mkBuf((i, n) => (n - i) / n);
  const dnBuf = mkBuf((i, n) => i / n);
  const input = ctx.createGain(), output = ctx.createGain();
  const src = (b) => { const s = ctx.createBufferSource(); s.buffer = b; s.loop = true; return s; };
  const t0 = ctx.currentTime + 0.05;
  const make = (offset) => {
    const up = src(upBuf), dn = src(dnBuf), fade = src(fadeBuf);
    const gUp = ctx.createGain(), gDn = ctx.createGain(), depth = ctx.createGain(), mix = ctx.createGain();
    gUp.gain.value = 0; gDn.gain.value = 1; depth.gain.value = 0; mix.gain.value = 0;
    const dl = ctx.createDelay(1); dl.delayTime.value = 0;
    up.connect(gUp).connect(depth); dn.connect(gDn).connect(depth); depth.connect(dl.delayTime);
    fade.connect(mix.gain);
    input.connect(dl).connect(mix).connect(output);
    up.start(t0 + offset); dn.start(t0 + offset); fade.start(t0 + offset);
    return { gUp, gDn, depth };
  };
  const A = make(0), B = make(T - F);
  return {
    input, output,
    set(semi) {
      const r = Math.pow(2, semi / 12), upw = r > 1, D = Math.abs(1 - r) * T, now = ctx.currentTime;
      [A, B].forEach((x) => { x.gUp.gain.setTargetAtTime(upw ? 1 : 0, now, 0.005); x.gDn.gain.setTargetAtTime(upw ? 0 : 1, now, 0.005); x.depth.gain.setTargetAtTime(D, now, 0.04); });
    }
  };
}

/* ---------- roll da música (CH4) ----------
   Um DelayNode com realimentação total repete a fatia no relógio do áudio: a música passa direto e o roll cai no grid. */
let rollIn, rollDelay, rollFb, rollOut, mThru, mRoll = null;
function buildMusicRoll() {
  mThru = ctx.createGain(); rollIn = ctx.createGain(); rollFb = ctx.createGain(); rollOut = ctx.createGain();
  rollDelay = ctx.createDelay(4);
  rollFb.gain.value = 0; rollOut.gain.value = 0;
  mSrc.connect(mThru).connect(mOut);
  mSrc.connect(rollIn).connect(rollDelay);
  rollDelay.connect(rollFb).connect(rollDelay);
  rollDelay.connect(rollOut).connect(mOut);
}
const rolling = () => mRoll && ctx.currentTime >= mRoll.sw;
function musicRollOn(div) {
  const L = divLen(div), now = ctx.currentTime, a = anchorEff();
  if (mRoll && Math.abs(mRoll.L - L) < 1e-6) return;
  if (mRoll && rolling()) {
    const tb = gridNext(now + 0.006, L);
    rollDelay.delayTime.cancelScheduledValues(now);
    rollDelay.delayTime.setValueAtTime(L - 128 / ctx.sampleRate, tb);
    mRoll.L = L; mRoll.div = div;
    return;
  }
  if (mRoll) musicRollOff();
  const s0 = a + Math.floor((now - a) / L) * L; let sw = s0 + L;
  if (sw - now < 0.008) sw += L;
  const X = 0.003;
  [rollIn.gain, rollFb.gain, rollOut.gain, mThru.gain, rollDelay.delayTime].forEach((p) => p.cancelScheduledValues(now));
  // no Chrome um laço com DelayNode soma 1 bloco de áudio (128 amostras) por volta: desconta aqui
  rollDelay.delayTime.setValueAtTime(L - 128 / ctx.sampleRate, now);
  rollIn.gain.setValueAtTime(1, now); rollFb.gain.setValueAtTime(0, now); rollOut.gain.setValueAtTime(0, now); mThru.gain.setValueAtTime(1, now);
  rollIn.gain.setValueAtTime(0, sw); rollFb.gain.setValueAtTime(1, sw);
  rollOut.gain.setValueAtTime(0, sw); rollOut.gain.linearRampToValueAtTime(1, sw + X);
  mThru.gain.setValueAtTime(1, sw); mThru.gain.linearRampToValueAtTime(0, sw + X);
  mRoll = { L, sw, div };
  applyMusicMix(sw);
}
function musicRollOff() {
  if (!mRoll) return;
  const now = ctx.currentTime, X = 0.005, was = rolling();
  [rollIn.gain, rollFb.gain, rollOut.gain, mThru.gain].forEach((p) => p.cancelScheduledValues(now));
  mRoll = null;
  if (!was) {
    rollIn.gain.setValueAtTime(1, now); rollFb.gain.setValueAtTime(0, now); rollOut.gain.setValueAtTime(0, now); mThru.gain.setValueAtTime(1, now);
  } else {
    rollOut.gain.setValueAtTime(rollOut.gain.value, now); rollOut.gain.linearRampToValueAtTime(0, now + X);
    mThru.gain.setValueAtTime(mThru.gain.value, now); mThru.gain.linearRampToValueAtTime(1, now + X);
    rollFb.gain.setValueAtTime(0, now + X); rollIn.gain.setValueAtTime(1, now + X);
  }
  applyMusicMix();
}

/* ---------- motor de áudio ----------
   canais 1-4 → fader → (seco para o master | FX bus, escolhido no CH8)
   FX bus → filtro (E8) → combo (CH7) → master, e envios para reverb (CH5) e echo (CH6) */
function makeIR(sec, decay) {
  const sr = ctx.sampleRate, n = Math.floor(sr * sec), b = ctx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    for (let i = 0; i < n; i++) { const t = i / n; d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay) * (i < sr * 0.012 ? i / (sr * 0.012) : 1); }
  }
  return b;
}
function bq(type, f, q, g) { const x = ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; if (q != null) x.Q.value = q; if (g != null) x.gain.value = g; return x; }
function gn(v) { const g = ctx.createGain(); g.gain.value = v; return g; }
async function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  master = gn(fadGain(st.master) * 0.9);
  const lim = ctx.createDynamicsCompressor();
  lim.threshold.value = -2; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = 0.002; lim.release.value = 0.1;
  master.connect(lim).connect(ctx.destination);
  analyser = ctx.createAnalyser(); analyser.fftSize = 8192; analyser.smoothingTimeConstant = 0.72;
  analyser.minDecibels = -90; analyser.maxDecibels = -10;
  lim.connect(analyser);
  // FX bus
  fxIn = gn(1);
  fltHP = bq('highpass', 10, 0.7); fltLP = bq('lowpass', 22000, 0.7);
  fxIn.connect(fltHP).connect(fltLP);
  buildCombo(fltLP);
  combo.out.connect(master);
  buildReverb(combo.out);
  buildEcho(combo.out);
  // canais
  for (let c = 0; c < 4; c++) {
    chG[c] = gn(fadGain(st.vol[c])); chDry[c] = gn(st.send[c] ? 0 : 1); chFx[c] = gn(st.send[c] ? 1 : 0);
    chG[c].connect(chDry[c]).connect(master); chG[c].connect(chFx[c]).connect(fxIn);
  }
  // música: pitch → roll → fader do CH4
  musicBus = gn(1);
  shifter = makeShifter();
  pDry = gn(1); pWet = gn(0); mSrc = gn(1); mOut = gn(1);
  // CH4: música → roll → pitch (o pitch só age no som do roll) → FX bus
  musicBus.connect(mSrc);
  const pIn = gn(1); mOut.connect(pIn);

// Detector de batida. O sinal passa por 2 passa-baixas em 200 Hz e é reduzido 16×.
// Em cada janela de 128 amostras mede a força do grave em 6 faixas (≈45-160 Hz) e soma só o que
// SUBIU de uma janela para a outra (fluxo espectral). Assim o ataque do kick vence o baixo que
// entra no contratempo, que pegava o detector antigo e jogava o grid fora do kick.

  (async () => {

  [['#tapBtn', 'bTap'], ['#nudgeL', 'bGridL'], ['#nudgeR', 'bGridR']].forEach(([sel, fn]) => {
    const el = $(sel); el.dataset.fn = fn;
    el.addEventListener('click', (e) => { if (st.ml) { e.stopImmediatePropagation(); mlPick(fn); } }, true);
  });
  $('#tapBtn').addEventListener('click', tap);
  $('#bpmSrc').addEventListener('click', () => {
    if (st.bpmSrc !== 'auto') {
      setBpm(live.L ? live.L.bpm : st.bpm, 'auto');
      if (live.L && !st.heldRolls.length) { st.anchor = live.L.anc; lastRollMsg = ''; updateRoll({ resync: true }); }
      toast('BPM automático');
    } else { setBpm(st.bpm, 'manual'); toast('BPM travado em ' + st.bpm.toFixed(1)); }
    renderPads();
  });
  document.querySelectorAll('#quant button').forEach((b) => b.addEventListener('click', () => {
    st.quant = Number(b.dataset.q);
    document.querySelectorAll('#quant button').forEach((x) => x.classList.toggle('on', x === b));
  }));
  $('#nudgeL').addEventListener('click', () => nudgeGrid(-10));
  $('#nudgeR').addEventListener('click', () => nudgeGrid(10));
  // entrada de áudio: escolher o dispositivo na lista liga a entrada; voltar para "Entrada de áudio" desliga
  const inSel = $('#inSel');
  inSel.addEventListener('focus', () => unlockInputNames());
  inSel.addEventListener('change', () => { if (inSel.value) startLive(); else stopLive(); renderPads(); });
  if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) navigator.mediaDevices.addEventListener('devicechange', () => listInputs());

  $('#slotClose').addEventListener('click', () => $('#slotDlg').close());
  $('#slotReplace').addEventListener('click', () => { slotTarget = { p: slotPad, k: pads[slotPad].cur }; $('#slotFile').click(); });
  $('#slotClear').addEventListener('click', () => {
    const p = slotPad;
    pads[p].slots[pads[p].cur] = null;
    const nxt = pads[p].slots.findIndex(Boolean);
    if (nxt >= 0) pads[p].cur = nxt;
    renderSlots(); renderPads();
  });
  $('#slotFile').addEventListener('change', (e) => { const f = e.target.files[0]; if (f && slotTarget) loadFileToSlot(f, slotTarget.p, slotTarget.k); e.target.value = ''; });

  $('#mlBtn').addEventListener('click', () => mlToggle());
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && st.ml) mlToggle(false); });
  $('#learnBtn').addEventListener('click', () => {
    if (st.ml) mlToggle(false);
    st.learning = null; st.seq = false; $('#learnSkip').hidden = true;
    $('#ctlProf').value = st.profile; $('#encMode').value = st.encMode;
    renderLearn(null, 'Controlador: ' + PROF_NAME[st.profile] + '. Toque numa função e mexa no controle, ou use Mapear tudo em sequência.');
    $('#learnDlg').showModal();
  });
  const fillProf = (sel) => { sel.innerHTML = ALL_PROFILES.map(([v]) => '<option value="' + v + '"></option>').join(''); ALL_PROFILES.forEach(([v, n], i) => { sel.options[i].textContent = n; }); sel.value = st.profile; };
  fillProf($('#ctlProf')); fillProf($('#ctlSel'));
  $('#ctlSel').addEventListener('change', (e) => switchProfile(e.target.value));
  $('#ctlProf').addEventListener('change', (e) => { st.seq = false; st.learning = null; $('#learnSkip').hidden = true; switchProfile(e.target.value); $('#ctlSel').value = st.profile; renderLearn(null, 'Controlador: ' + PROF_NAME[st.profile] + '.'); });
  $('#encMode').addEventListener('change', (e) => { st.encMode = e.target.value; save(); toast({ mcu: 'Encoders no modo Mackie', twos: 'Encoders relativos (complemento de 2)', abs: 'Encoders absolutos (0 a 127)' }[st.encMode]); });
  const gl = $('#gridLed');
  gl.innerHTML = Object.keys(GRID_LED).map((k) => '<option value="' + k + '">Luz do grid: ' + GRID_LED[k].label + '</option>').join('');
  gl.value = st.gridLed;
  gl.addEventListener('change', (e) => { gridLed(false); st.gridLed = e.target.value; save(); });
  const mo = $('#midiOutSel');
  const fillOuts = () => { const o = allOuts(); mo.innerHTML = '<option value="">Saída das luzes: automática</option>' + o.map(() => '<option></option>').join(''); o.forEach((x, i) => { mo.options[i + 1].value = x.id; mo.options[i + 1].textContent = 'Saída: ' + x.name; }); mo.value = o.some((x) => x.id === st.midiOut) ? st.midiOut : ''; };
  $('#learnBtn').addEventListener('click', fillOuts);
  mo.addEventListener('change', (e) => { st.midiOut = e.target.value; save(); lightCache = {}; updateButtons(); });
  $('#btnTest').addEventListener('click', () => {
    const outs = midiOuts();
    if (!outs.length) { toast('Nenhuma saída MIDI encontrada'); return; }
    const notes = []; for (let n = 0; n < 32; n++) notes.push(n); [91, 92, 93, 94, 95, 46, 47, 96, 97, 98, 99].forEach((n) => notes.push(n));
    notes.forEach((n) => outs.forEach((o) => { try { o.send([0x90, n, 127]); } catch (e) { /* ok */ } }));
    setTimeout(() => { notes.forEach((n) => outs.forEach((o) => { try { o.send([0x90, n, 0]); } catch (e) { /* ok */ } })); lightCache = {}; updateButtons(); }, 1200);
    toast('Acendendo todos os botões por 1 s em: ' + outs.map((o) => o.name).join(', '));
  });
  let sweepT = null;
  $('#ledSweep').addEventListener('click', () => {
    const btn = $('#ledSweep');
    if (sweepT) { clearInterval(sweepT); sweepT = null; btn.textContent = 'Varrer notas 0-127'; lightCache = {}; return; }
    const outs = midiOuts(); if (!outs.length) { toast('Nenhuma saída MIDI encontrada'); return; }
    let n = 0;
    sweepT = setInterval(() => {
      outs.forEach((o) => { try { if (n > 0) o.send([0x90, n - 1, 0]); if (n < 128) o.send([0x90, n, 127]); } catch (e) { /* ok */ } });
      $('#lastMidi').textContent = n < 128 ? 'acendendo nota ' + n + ' (anote quais acendem)' : 'varredura terminada';
      n++; if (n > 128) { clearInterval(sweepT); sweepT = null; btn.textContent = 'Varrer notas 0-127'; lightCache = {}; }
    }, 350);
    btn.textContent = 'Parar varredura';
  });
  document.addEventListener('dragover', (e) => e.preventDefault());
  document.addEventListener('drop', (e) => { e.preventDefault(); if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) toast('Solte em cima de um canal de sample (1 a 3) ou de um pad de baixo'); });
  $('#gridTest').addEventListener('click', () => { gridLed(true); setTimeout(() => gridLed(false), 600); toast(midiOuts().length ? 'Piscou os LEDs: ' + GRID_LED[st.gridLed].label : 'Nenhuma saída MIDI da SMC encontrada'); });
  $('#learnSeq').addEventListener('click', () => { st.seq = true; st.seqUsed = new Set(); $('#learnSkip').hidden = false; seqNext(null, ''); });
  $('#learnSkip').addEventListener('click', () => { if (st.seq && st.learning) seqNext(st.learning, 'Pulou. '); });
  $('#learnClose').addEventListener('click', () => { st.learning = null; st.seq = false; $('#learnDlg').close(); });
  $('#learnDlg').addEventListener('close', () => { st.learning = null; st.seq = false; $('#learnSkip').hidden = true; lightCache = {}; updateButtons(); });
  $('#learnReset').addEventListener('click', () => {
    const fresh = Object.assign(emptyMap(), PROF_DEF()[st.profile] || {});
    st.maps[st.profile] = fresh; st.map = fresh; st.learning = null; st.seq = false; save(); lightCache = {};
    renderLearn(null, PROF_DEF()[st.profile] ? 'Mapa padrão do ' + PROF_NAME[st.profile] + ' restaurado.' : 'Mapa apagado. Use Mapear tudo em sequência.');
  });

  $('#audioBtn').addEventListener('click', () => {
    listInputs();
    if (ctx) { const ms = ((ctx.baseLatency || 0) + (ctx.outputLatency || 0)) * 1000; $('#latTxt').textContent = ms > 0 ? ms.toFixed(1) + ' ms (saída)' : 'não informada pelo navegador'; }
    $('#outNote').textContent = ctx && ctx.setSinkId ? '' : 'Este navegador não deixa escolher a saída: use a saída padrão do sistema.';
    $('#bpmMin').value = st.bpmMin; $('#bpmMax').value = st.bpmMax;
    $('#audioDlg').showModal();
  });
  $('#audioClose').addEventListener('click', () => $('#audioDlg').close());
  $('#outSel').addEventListener('change', async (e) => {
    if (!ctx || !ctx.setSinkId) return;
    try { await ctx.setSinkId(e.target.value); toast('Saída trocada.'); } catch (err) { toast('Não consegui usar essa saída.'); }
  });
  $('#bpmMin').addEventListener('change', (e) => { st.bpmMin = Math.min(Number(e.target.value) || 115, st.bpmMax - 1); save(); });
  $('#bpmMax').addEventListener('change', (e) => { st.bpmMax = Math.max(Number(e.target.value) || 135, st.bpmMin + 1); save(); });
  $('#testSnd').addEventListener('click', () => { if (ctx) playSample(0, ctx.currentTime, 1); });

  // teclado: Z X C = Kick, Snare, Clap uma vez · V = música como alvo · A S D F (segurar) = roll 1/4 a 1/32 no último canal
  const ROLLK = { a: 0, s: 1, d: 2, f: 3 }, held = {};
  window.addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    const tg = e.target.tagName;
    if (tg === 'INPUT' || tg === 'SELECT' || tg === 'BUTTON' || document.querySelector('dialog[open]')) return;
    const k = e.key.toLowerCase();
    if (k === 'z' || k === 'x' || k === 'c') { e.preventDefault(); oneShot({ z: 0, x: 1, c: 2 }[k]); }
    else if (k === 'v') { e.preventDefault(); st.lastCh = MUSIC; toast('Teclas A S D F rolam a música'); }
    else if (k in ROLLK) { e.preventDefault(); held[k] = st.lastCh; rollPress(st.lastCh, ROLLK[k], true); }
    else if (k === 't') { e.preventDefault(); tap(); }
  });
  window.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (k in ROLLK && held[k] != null) { rollPress(held[k], ROLLK[k], false); held[k] = null; } });
}

window.addEventListener('error', (e) => toast('Erro: ' + e.message));
window.addEventListener('unhandledrejection', (e) => toast('Erro: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
load();
buildConsole(); buildKnobs(); FADERS.forEach((F) => renderFader(F.fn));
bind();
renderPads();
setInterval(updateButtons, 120);
requestAnimationFrame(frame);
})();

</script>

</body></html>
